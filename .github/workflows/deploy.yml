name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_html:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -O --location https://elan.lean-lang.org/elan-init.sh
          sh elan-init.sh -y --default-toolchain stable
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # このステップは lake run build_html を実行するために必要
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: build markdown and HTML files
        run: lake run build_html

      - name: Upload HTML
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: ./book
          if-no-files-found: error

  build_pdf:
    permissions:
      contents: read
    uses: ./.github/workflows/pdf.yml

  assemble:
    needs: [build_html, build_pdf]
    # PDF が失敗しても、HTML が完成していれば公開用の成果物を作る。
    if: ${{ !cancelled() && needs.build_html.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download HTML
        uses: actions/download-artifact@v8
        with:
          name: html
          path: ./book

      - name: Download PDF
        if: needs.build_pdf.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: ./pdf-artifact

      - name: Prepare PDF download
        id: prepare_pdf
        # PDF の取得や配置の失敗によって HTML の公開を止めない。
        continue-on-error: true
        run: node scripts/preparePdfDownload.mjs site

      - name: Report PDF preparation failure
        if: steps.prepare_pdf.outcome == 'failure'
        run: |
          echo '::warning::PDF preparation failed. HTML deployment will continue.'
          echo 'PDF preparation failed. HTML deployment will continue.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book

  deploy:
    # 祖先の PDF ジョブが失敗した場合も、集約に成功していれば公開する。
    if: ${{ !cancelled() && needs.assemble.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
